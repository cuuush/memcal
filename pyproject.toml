[project]
name = "memcal"
version = "0.6.0"
description = "A calendar and a to-do list that live in context, fed by the streams you already get."
requires-python = ">=3.11"
dependencies = []

# The core stays dependency-free: every source that needs a library imports it inside
# `connect()` and reports the gap through `check()`, so a missing extra disables one
# source rather than breaking the registry. Install only what you actually feed it.
#
#   pip install -e '.[slack]'        pip install -e '.[chat]'   # all of them
#
# Signal is deliberately absent. `signal-cli` is a JVM program, not a Python package:
# `brew install signal-cli`, then `memcal login signal`.
[project.optional-dependencies]
slack = ["slack_sdk>=3.27"]
telegram = ["telethon>=1.36"]
chat = ["slack_sdk>=3.27", "telethon>=1.36"]

[project.scripts]
memcal = "memcal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The filesystem is the declaration. An explicit `packages` list does not walk
# subpackages of the entries in it, so `memcal.sources.providers` — a real package that
# `ical.py` imports unconditionally — was on disk and absent from every wheel, and the
# iCal connector raised ImportError on any `pip install .`. Nothing caught it because
# nothing does that: `install.sh` runs from the checkout with PYTHONPATH. Naming the
# fourth package would have fixed this instance; `find` makes a fifth impossible.
[tool.setuptools.packages.find]
include = ["memcal*"]
namespaces = false

[tool.setuptools.package-data]
memcal = ["schema.sql", "webui.html", "static/*.css", "static/*.js"]

# Third-party sources advertise themselves here:
#   [project.entry-points."memcal.sources"]
#   slack = "my_package.slack:SlackSource"
