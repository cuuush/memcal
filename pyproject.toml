[project]
name = "memcal"
version = "0.8.0"
description = "A calendar and a to-do list that live in context, fed by the streams you already get."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Cush", email = "chris@cuuush.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "calendar", "memory", "agents", "openclaw", "hermes", "slack"]
dependencies = [
    # Decode iMessage `attributedBody` typedstream blobs with a real deserializer
    # instead of a hand-rolled byte scraper. See memcal/sources/imessage.py.
    "pytypedstream>=0.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/cuuush/memcal"
Repository = "https://github.com/cuuush/memcal"
Issues = "https://github.com/cuuush/memcal/issues"
Documentation = "https://cuuush.github.io/memcal/"

# Per-source libraries are extras: a source that needs one imports it inside `connect()`
# and reports the gap through `check()`, so not installing it disables that one source
# rather than breaking the registry. Install only what you actually feed it.
#
#   pip install -e '.[slack]'        pip install -e '.[chat]'   # all of them
#
# Signal is deliberately absent. `signal-cli` is a JVM program, not a Python package:
# `brew install signal-cli`, then `memcal login signal`.
[project.optional-dependencies]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.6"]
slack = ["slack_sdk>=3.27"]
telegram = ["telethon>=1.36"]
chat = ["slack_sdk>=3.27", "telethon>=1.36"]

[project.scripts]
memcal = "memcal.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Use find to include subpackages. An explicit list omits nested packages
# such as `memcal.sources.providers`, which breaks wheels.
[tool.setuptools.packages.find]
include = ["memcal*"]
namespaces = false

[tool.setuptools.package-data]
memcal = ["schema.sql", "webui.html", "macos/icon.png", "macos/launcher.c",
          "static/*.css", "static/*.js", "static/*.png"]

# Third-party sources advertise themselves here:
#   [project.entry-points."memcal.sources"]
#   slack = "my_package.slack:SlackSource"
