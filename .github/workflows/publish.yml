name: Publish to PyPI

# Build and publish the package whenever a version tag is pushed (e.g. `v0.8.1`).
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time PyPI setup is required — see the `pypi` environment publisher config on
# pypi.org (owner: cuuush, repo: memcal, workflow: publish.yml, environment: pypi).
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The tag must match the version in pyproject.toml, or the upload is rejected.
    environment:
      name: pypi
      url: https://pypi.org/project/memcal/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
